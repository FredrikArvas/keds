<head>
  <meta charset="UTF-8">

  <title>KEDS – Karolinska Exhaustion Disorder Scale</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --background-color: #f8f9fa;
      --text-color: #333;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --success-color: #27ae60;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --button-bg: #3498db;
      --button-hover: #2980b9;
      --button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin: 20px 0;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 1rem;
    }

    /* Language selector */
    .lang-selector {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: var(--secondary-color);
      padding: 5px 10px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .lang-selector:hover {
      background-color: rgba(52, 152, 219, 0.1);
    }

    /* Progress bar */
    .progress-container {
      margin-bottom: 30px;
    }

    .progress-bar {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--secondary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      text-align: center;
      margin-top: 8px;
      font-size: 0.9rem;
      color: #666;
    }

    /* Question container */
    .question-container {
      display: none;
    }

    .question-container.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 25px;
      line-height: 1.6;
      color: var(--text-color);
    }

    .question-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    /* Answer options */
    .answer-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .answer-option {
      display: flex;
      align-items: center;
      padding: 15px;
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .answer-option:hover {
      border-color: var(--secondary-color);
      background-color: rgba(52, 152, 219, 0.05);
    }

    .answer-option.selected {
      border-color: var(--secondary-color);
      background-color: rgba(52, 152, 219, 0.1);
    }

    .answer-option input[type="radio"] {
      margin-right: 12px;
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .answer-option label {
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-color);
    }

    .answer-scale {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 0.8rem;
      color: #888;
    }

    /* Navigation buttons */
    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .btn-primary {
      background-color: var(--button-bg);
      color: var(--button-text);
    }

    .btn-primary:hover {
      background-color: var(--button-hover);
    }

    .btn-secondary {
      background-color: var(--background-color);
      color: var(--primary-color);
      border: 2px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Result page */
    .result-page {
      display: none;
      text-align: center;
    }

    .result-page.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .result-score {
      font-size: 3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin: 20px 0;
    }

    .result-level {
      font-size: 1.5rem;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
    }

    .result-level.low {
      background-color: rgba(39, 174, 96, 0.1);
      color: var(--success-color);
    }

    .result-level.high {
      background-color: rgba(231, 76, 60, 0.1);
      color: var(--danger-color);
    }

    .result-advice {
      background-color: rgba(52, 152, 219, 0.05);
      padding: 20px;
      border-radius: 8px;
      margin: 25px 0;
      text-align: left;
    }

    .result-advice h3 {
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .result-advice p {
      margin-bottom: 10px;
    }

    /* Info section */
    .info-section {
      margin-top: 30px;
      padding: 20px;
      background-color: rgba(52, 152, 219, 0.05);
      border-radius: 8px;
      font-size: 0.9rem;
      color: #555;
    }

    .info-section h3 {
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 0.8rem;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .question-text {
        font-size: 1rem;
      }

      .result-score {
        font-size: 2.5rem;
      }

      .navigation {
        flex-direction: column-reverse;
        gap: 10px;
      }

      .btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      .header h1 {
        font-size: 1.3rem;
      }

      .answer-option {
        padding: 12px;
      }

      .answer-option label {
        font-size: 0.85rem;
      }

      .result-score {
        font-size: 2rem;
      }

      .result-level {
        font-size: 1.2rem;
      }
    }

    /* Print styles */
    @media print {
      .lang-selector,
      .navigation,
      .btn {
        display: none !important;
      }

      .question-container {
        display: block !important;
        page-break-inside: avoid;
      }

      body {
        background-color: white;
      }
    }
  </style>
</head>

    <!-- Result page -->

        <p id="advice-text"></p>
      </div>

      <div class="info-section">
        <h3 id="info-title">Om KEDS</h3>
        <p id="info-text"></p>
      </div>

      <button class="btn btn-primary" onclick="restartTest()" id="restart-btn">Gör testet igen</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p id="footer-text">KEDS är utvecklat av Karolinska Institutet. Detta test är endast för självskattning.</p>

          {
            id: 7,
            title: "7. Sensitivity to sensory impressions",
            text: "This question concerns whether you feel that one or more of your senses have become more sensitive to impressions, e.g., sound, light, smells, or touch.",
            options: [
              "I do not think my senses are more sensitive than usual.",
              "",
              "Sometimes sound, light, or other sensory impressions feel unpleasant.",
              "",
              "I often experience sound, light, or other sensory impressions as disturbing or unpleasant.",
              "",
              "Sound, light, or other sensory impressions bother me so much that I withdraw to give my senses a rest."
            ]
          },
          {
            id: 8,
            title: "8. Perception of demands",
            text: "Here we ask you to consider how you react to demands that you feel are placed on you in everyday life. These demands can come from your environment or yourself.",
            options: [
              "I do what I should or want to do without feeling that it is particularly demanding or troublesome.",
              "",
              "Everyday situations that I previously handled without particular problems can sometimes feel demanding and cause discomfort or make me feel more stressed than usual.",
              "",
              "Situations that I previously handled without problems now often feel demanding and cause strong discomfort or stress.",
              "",
              "Almost everything feels demanding and I cannot handle it at all."
            ]
          },
          {
            id: 9,
            title: "9. Irritation and anger",
            text: "This question concerns how easily irritated or angry you feel inside, regardless of whether you show it outwardly or not. Consider especially how easily your irritation is triggered (short temper), in relation to what triggers it, and how often and how intensely you feel angry or irritated. If you cannot feel these emotions at all, you should mark 0.",
            options: [
              "I do not feel particularly irritable.",
              "",
              "I feel more impatient or irritable than usual, but it also passes quickly.",
              "",
              "I get angry or provoked more easily than usual. Sometimes I lose my temper in a way that is not normal for me.",
              "",
              "I often feel utterly enraged inside and must exert myself to the utmost to control myself."
            ]
          }
        ]
      }
    };

    // ============================================
    // STATE
    // ============================================

    let currentLanguage = "sv";
    let currentQuestionIndex = 0;
    let answers = Array(9).fill(null);
    let questionsRendered = false;

    // ============================================
    // DOM ELEMENTS
    // ============================================

    const titleEl = document.getElementById("title");
    const subtitleEl = document.getElementById("subtitle");
    const progressFillEl = document.getElementById("progress-fill");
    const progressTextEl = document.getElementById("progress-text");
    const questionPagesEl = document.getElementById("question-pages");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const resultPageEl = document.getElementById("result-page");
    const resultScoreEl = document.getElementById("result-score");
    const resultLevelEl = document.getElementById("result-level");
    const adviceTextEl = document.getElementById("advice-text");
    const adviceTitleEl = document.getElementById("advice-title");
    const infoTitleEl = document.getElementById("info-title");
    const infoTextEl = document.getElementById("info-text");
    const footerTextEl = document.getElementById("footer-text");
    const resultTitleEl = document.getElementById("result-title");
    const resultSubtitleEl = document.getElementById("result-subtitle");

    // ============================================
    // INITIALIZATION
    // ============================================

    // Detect browser language
    function detectLanguage() {
      const browserLang = navigator.language || navigator.userLanguage;
      return browserLang.startsWith("sv") ? "sv" : "en";
    }

    // Initialize
    function init() {
      currentLanguage = detectLanguage();
      renderQuestions();
      updateUI();
      questionsRendered = true;
    }

    // ============================================
    // RENDER QUESTIONS
    // ============================================

    function renderQuestions() {
      const lang = languages[currentLanguage];
      questionPagesEl.innerHTML = "";

      lang.questions.forEach((question, index) => {
        const questionEl = document.createElement("div");
        questionEl.className = `question-container ${index === 0 ? "active" : ""}`;
        questionEl.id = `question-${index}`;

        questionEl.innerHTML = `
          <div class="question-title">${question.title}</div>
          <div class="question-text">${question.text}</div>
          <div class="answer-options">
            ${question.options.map((option, optionIndex) => `
              <label class="answer-option" for="q${index}-${optionIndex}">
                <input 
                  type="radio" 
                  id="q${index}-${optionIndex}" 
                  name="question-${index}" 
                  value="${optionIndex}" 
                  onchange="selectAnswer(${index}, ${optionIndex})"
                  ${answers[index] === optionIndex ? "checked" : ""}
                >
                <span>${option || `Poäng: ${optionIndex}`}</span>
              </label>
            `).join("")}
          </div>
          <div class="answer-scale">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
          </div>
        `;

        questionPagesEl.appendChild(questionEl);
      });
    }

    // ============================================
    // NAVIGATION
    // ============================================

    function showQuestion(index) {
      // Hide all questions
      document.querySelectorAll(".question-container").forEach(el => {
        el.classList.remove("active");
      });

      // Show current question
      const currentQuestionEl = document.getElementById(`question-${index}`);
      if (currentQuestionEl) {
        currentQuestionEl.classList.add("active");
      }

      currentQuestionIndex = index;
      updateUI();
    }

    function nextQuestion() {
      if (currentQuestionIndex < 8) {
        showQuestion(currentQuestionIndex + 1);
      } else {
        showResult();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        showQuestion(currentQuestionIndex - 1);
      }
    }

    function selectAnswer(questionIndex, value) {
      answers[questionIndex] = value;
      
      // Auto-advance if not on last question
      if (questionIndex < 8) {
        // Small delay for better UX
        setTimeout(() => {
          showQuestion(questionIndex + 1);
        }, 200);
      }
    }

    // ============================================
    // RESULT
    // ============================================

    function calculateScore() {
      return answers.reduce((sum, answer) => {
        // Only count if answer is not null (all questions answered)
        return sum + (answer !== null ? answer : 0);
      }, 0);
    }

    function showResult() {
      const score = calculateScore();
      const lang = languages[currentLanguage];

      // Update result page
      resultScoreEl.textContent = score;
      
      // Determine risk level
      const isHighRisk = score >= 19;
      resultLevelEl.textContent = isHighRisk ? lang.riskHigh : lang.riskLow;
      resultLevelEl.className = `result-level ${isHighRisk ? "high" : "low"}`;
      
      adviceTitleEl.textContent = lang.adviceTitle;
      adviceTextEl.textContent = isHighRisk ? lang.adviceHigh : lang.adviceLow;
      
      resultTitleEl.textContent = lang.resultTitle;
      resultSubtitleEl.textContent = lang.resultSubtitle;
      infoTitleEl.textContent = lang.infoTitle;
      infoTextEl.textContent = lang.infoText;
      footerTextEl.textContent = lang.footerText;

      // Hide questions
      questionPagesEl.style.display = "none";
      document.querySelector(".navigation").style.display = "none";
      document.querySelector(".progress-container").style.display = "none";

      // Show result
      resultPageEl.classList.add("active");
    }

    function restartTest() {
      currentQuestionIndex = 0;
      answers = Array(9).fill(null);

      // Show first question
      questionPagesEl.style.display = "block";
      document.querySelector(".navigation").style.display = "flex";
      document.querySelector(".progress-container").style.display = "block";
      resultPageEl.classList.remove("active");

      showQuestion(0);
      renderQuestions(); // Re-render to clear selections
    }

    // ============================================
    // LANGUAGE
    // ============================================

    function toggleLanguage() {
      currentLanguage = currentLanguage === "sv" ? "en" : "sv";
      updateUI();
      
      // If on result page, update it
      if (resultPageEl.classList.contains("active")) {
        showResult();
      } else {
        renderQuestions();
        showQuestion(currentQuestionIndex);
      }
    }

    // ============================================
    // UI UPDATES
    // ============================================

    function updateUI() {
      const lang = languages[currentLanguage];
      const totalQuestions = 9;
      const progressPercent = ((currentQuestionIndex) / totalQuestions) * 100;

      // Update header
      titleEl.textContent = lang.title;
      subtitleEl.textContent = lang.subtitle;

      // Update progress
      progressFillEl.style.width = `${progressPercent}%`;
      progressTextEl.textContent = lang["questionLabel"] 
        ? `${lang["questionLabel"]} ${currentQuestionIndex + 1} ${lang.of || "av"} ${totalQuestions}`
        : `Fråga ${currentQuestionIndex + 1} av ${totalQuestions}`;

      // Update buttons
      prevBtn.textContent = lang.prev;
      prevBtn.disabled = currentQuestionIndex === 0;

      if (currentQuestionIndex < 8) {
        nextBtn.textContent = lang.next;
      } else {
        nextBtn.textContent = lang.finish || lang.next;
      }

      // Update footer
      footerTextEl.textContent = lang.footerText;
    }

    // ============================================
    // KEYBOARD NAVIGATION
    // ============================================

    document.addEventListener("keydown", (e) => {
      // Next question with Enter or Right Arrow
      if ((e.key === "Enter" || e.key === "ArrowRight") && currentQuestionIndex < 8) {
        e.preventDefault();
        nextQuestion();
      }
      // Previous question with Left Arrow
      else if (e.key === "ArrowLeft" && currentQuestionIndex > 0) {
        e.preventDefault();
        prevQuestion();
      }
      // Select answer with number keys (0-6)
      else if (e.key >= "0" && e.key <= "6") {
        const value = parseInt(e.key);
        selectAnswer(currentQuestionIndex, value);
      }
    });

    // ============================================
    // START
    // ============================================

    // Initialize when DOM is loaded
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
